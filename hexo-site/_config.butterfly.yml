# --------------------------------------
# Hexo Butterfly Theme Configuration
# CoolPig's Academic Website
# --------------------------------------

# ========================================
# 导航栏配置（经常修改）
# ========================================

# 网站导航栏设置
nav:
  # 【修改】网站 Logo 图片路径
  logo: /images/profile.png
  # 是否显示网站标题
  display_title: true
  # 是否显示文章标题
  display_post_title: true
  # 导航栏是否固定在顶部
  fixed: false

# 【修改】导航菜单配置
# 格式：菜单名: /路径/ || 图标类名
# 图标参考：https://fontawesome.com/icons
#
# 【提示】注释或删除不需要的菜单项即可隐藏
menu:
  首页: / || fas fa-home
  文章: /archives/ || fas fa-archive
  关于我: /cv/ || fas fa-file-alt
  # 关于: /about/ || fas fa-user
  # 论文: /publications/ || fas fa-book
  # 报告: /talks/ || fas fa-chalkboard-teacher
  # 教学: /teaching/ || fas fa-user-graduate
  # 作品集: /portfolio/ || fas fa-images

# 【修改】社交媒体链接
# 格式：图标类名: 链接 || 显示名称 || 颜色
social:
  fab fa-github: Github || '#24292e'\r
  fas fa-envelope: mailto:coolpig0720@gmail.com || Email || '#4a7dbe'

# --------------------------------------
# Image Settings
# --------------------------------------

# 【修改】网站图标
favicon: /images/favicon.ico

# 【修改】头像配置
# img: 头像图片路径（放在 source/images/ 目录下）
# effect: 是否启用转动效果（true=转动，false=不转动）
avatar:
  img: /images/avatar.png
  effect: false

disable_top_img: true
default_top_img:
index_img:
archive_img:
tag_img:
tag_per_img:
category_img:
category_per_img:
footer_img: false

# Website Background (light color instead of blue)
background: "#f5f7fa"

# --------------------------------------
# 404 Page
# --------------------------------------

# 自定义 404 页面（启用后生成 404.html，GitHub Pages 自动接管）
# background 使用主题自带插图；如想换图，放到 source/images/ 后改路径即可
error_404:
  enable: true
  subtitle: "页面走丢了，去首页看看吧"
  background: /img/404.jpg

# --------------------------------------
# Footer
# --------------------------------------

# 页脚配置（显式声明，覆盖主题默认值）
# owner.since：建站年份，与当前年不同时显示为区间，如 © 2025 - 2026 By CoolPig
# copyright：Hexo 框架与 Butterfly 主题的版本信息
# custom_text：自定义文案，支持 HTML
# nav：页脚导航栏，占位页面完善后可在此添加入口
footer:
  nav:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: true
    version: true
  custom_text: 记录游戏开发与图形学习之路 🎮

cover:
  index_enable: true
  archive_enable: true
  tag_enable: true
  category_enable: true
  post_cover_policy: cover
  post_cover:

# --------------------------------------
# Site Settings
# --------------------------------------

start_time: 2025-01-01
timezone: Asia/Shanghai

# --------------------------------------
# Aside (Sidebar) Settings
# --------------------------------------

# ========================================
# 侧边栏配置（经常修改）
# ========================================

aside:
  # 是否启用侧边栏
  enable: true
  # 是否隐藏侧边栏
  hide: false
  # 是否显示侧边栏切换按钮
  button: true
  # 移动端是否显示侧边栏
  mobile: true
  # 侧边栏位置：left 或 right
  position: left

  # 【修改】作者信息卡片
  card_author:
    enable: true
    # 【修改】个人简介文字（直接写字符串，不要用对象格式）
    description: 路虽远行则将至，事虽难做则必成。
    # 【禁用】Follow Me 按钮（因为下面已有社交图标）
    button:
      enable: false

  # 【修改】公告卡片
  card_announcement:
    enable: true
    # 【修改】公告内容
    content: 欢迎来到我的个人网站！

  # 最新文章卡片
  card_recent_post:
    enable: true
    # 显示文章数量
    limit: 5
    # 排序方式：date 或 updated
    sort: date

  # 分类卡片
  card_categories:
    enable: true
    limit: 0
    expand: none

  # 标签卡片（已禁用）
  card_tags:
    enable: false

  # 归档卡片（已禁用）
  card_archives:
    enable: false

  # 网站信息卡片（已禁用）
  card_webinfo:
    enable: false

# --------------------------------------
# Index Page Settings
# --------------------------------------

index_post_content:
  method: 3
  length: 500

# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  theme: light
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# --------------------------------------
# Pagination Settings
# --------------------------------------

pagination:
  enable: true
  total: 10
  type: auto
  prev_text: '<i class="fas fa-angle-left"></i>'
  next_text: '<i class="fas fa-angle-right"></i>'
  offset: 0

# --------------------------------------
# Comments Settings
# --------------------------------------

comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

# --------------------------------------
# Donation/Sponsor Settings
# --------------------------------------

donate:
  enable: false
  title:
  QR_code:

# --------------------------------------
# MathJax Support
# --------------------------------------

math:
  use: mathjax
  per_page: true

# --------------------------------------
# Mermaid Support (Client-side rendering)
# --------------------------------------

mermaid:
  enable: true
  version: "10"
  theme: "default"

# --------------------------------------
# Search Settings
# --------------------------------------

search:
  use: local_search
  placeholder: 搜索文章...

# Local search
local_search:
  enable: true
  preload: false
  CDN:

# --------------------------------------
# Share Settings
# --------------------------------------

# 【禁用】文章分享功能
share:
  use: ""
  sharejs:
    sites: ""
  addthis:
    enable: false
    pubid:

# --------------------------------------
# Post Copyright Settings
# --------------------------------------

# 【禁用】文章版权声明区域
post_copyright:
  enable: false

# 【禁用】文章编辑按钮
post_edit:
  enable: false

# 相关文章推荐：文章末尾按 tag 重合度推荐，串联系列笔记
# 此前靠主题默认值生效，这里显式声明便于调整
related_post:
  enable: true
  limit: 4          # 最多展示 4 篇，全站文章还不多，6 篇容易凑数
  date_type: created

# --------------------------------------
# Dark Mode Settings
# --------------------------------------

darkmode:
  enable: true
  button: true

# --------------------------------------
# Translate Settings (Traditional/Simplified Chinese)
# --------------------------------------

translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: "繁"
  msgToSimplifiedChinese: "简"

# --------------------------------------
# Right Side Buttons
# --------------------------------------

rightside_item_order:
  enable: true
  hide: readmode,translate,darkmode,hideAside
  show: toc

# --------------------------------------
# Read Mode
# --------------------------------------

readmode: true

# --------------------------------------
# TOC (Table of Contents) Settings
# --------------------------------------

toc:
  enable: true
  number: false
  depth: 2
  expand_percent: 0
  scroll_percent: false
  scrollspy: false
  update_url: false

# --------------------------------------
# Analytics
# --------------------------------------

analytics:
  baidu:
  google:
  cnzz:
  tencent:
    enable: false
    sid:
    cid:

# --------------------------------------
# Verification
# --------------------------------------

verification:
  google:
  baidu:
  yandex:
  so:
  sogou:

# --------------------------------------
# Other Settings
# --------------------------------------

busuanzi:
  enable: false

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 50

wordcount:
  enable: true
  count_on_home: false
  post_wordcount: true
  min2read: true
  wordcount: true
  separation: true

# 图片灯箱：点击文章图片平滑放大，再点/滚动收回（可选 fancybox / medium_zoom）
lightbox: medium_zoom

# 图片懒加载：滞后加载文章内图片，提升长图文（如 HLSL 笔记）首屏速度
# field: post = 仅对文章内容生效；blur = 加载前模糊占位效果
lazyload:
  enable: true
  field: post
  placeholder:
  blur: true
  progress: false
  error_img: false
  stream: false

pjax:
  enable: false

# --------------------------------------
# Inject Custom Code
# --------------------------------------

inject:
  enable: true
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/custom.js"></script>

cdn:
  enable: false

# --------------------------------------
# Live2D Settings - Disabled
# --------------------------------------

live2d:
  enable: false
  modelUrl:
  scriptUrl:
